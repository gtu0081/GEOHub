[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "geohub-shopify-backend"
version = "0.1.0"
description = "GEOHub Shopify GEO app backend (Phase 0 PoC)"
requires-python = ">=3.11,<3.15"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pyjwt>=2.9,<3",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

# geo-seo-hub is installed from the repository root:
#   pip install -e ../.. ../.   (see shopify-app/README.md)
[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
